name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dev dependencies
        run: npm install

      - name: Install aitri CLI globally
        run: npm install -g .

      - name: Run full test suite
        run: npm run test:all

      # Coverage floor on lib/ + bin/ (tests excluded). One matrix leg is enough;
      # the floors (90 lines / 80 branches) sit below the current ~95/84 so a real
      # dip fails loudly without flaking on noise. Aitri offers consumer projects
      # a coverage quality_gate — this is the same gate, dogfooded.
      - name: Coverage floor (lines 90 / branches 80)
        if: matrix.node-version == 24
        run: npm run test:coverage
